name: Release

# Push a version tag (for example v1.0.0) to build and publish a GitHub Release:
#   git tag v1.0.0 && git push origin v1.0.0

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish (arm64)
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          sw_vers

      - name: Build release
        run: |
          set -o pipefail
          xcodebuild -project airpod_control.xcodeproj \
            -scheme airpod_control \
            -configuration Release \
            -derivedDataPath build-release \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Report compile errors as annotations
        if: failure()
        run: |
          grep -E "(error|warning):" "$GITHUB_WORKSPACE/build.log" \
            | grep -v "^$" | sort -u | head -50 \
            | while IFS= read -r line; do echo "::error::${line:0:400}"; done

      - name: Verify target and architecture
        run: |
          APP="build-release/Build/Products/Release/airpod_control.app"
          BIN="$APP/Contents/MacOS/airpod_control"
          vtool -show-build "$BIN"
          MINOS=$(vtool -show-build "$BIN" | awk '/minos/ {print $NF}')
          if [[ "$MINOS" != 26.* ]]; then
            echo "::error::Expected deployment target 26.x, got $MINOS"
            exit 1
          fi
          ARCHS=$(lipo -archs "$BIN")
          echo "architectures: $ARCHS"
          if [[ "$ARCHS" != *arm64* ]]; then
            echo "::error::Expected an arm64 build, got $ARCHS"
            exit 1
          fi

      - name: Package app
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p release-stage
          ditto build-release/Build/Products/Release/airpod_control.app "release-stage/AirPods Control.app"
          ditto -c -k --sequesterRsrc --keepParent \
            "release-stage/AirPods Control.app" \
            "$GITHUB_WORKSPACE/AirPods-Control-$TAG.zip"
          shasum -a 256 "$GITHUB_WORKSPACE/AirPods-Control-$TAG.zip"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$GITHUB_WORKSPACE/AirPods-Control-$TAG.zip" --clobber
          else
            gh release create "$TAG" \
              "$GITHUB_WORKSPACE/AirPods-Control-$TAG.zip" \
              --title "AirPods Control $TAG" \
              --generate-notes
          fi
